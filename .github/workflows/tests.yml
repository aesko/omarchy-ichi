name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      # tests/run.sh skips a suite whose runtime is missing, which is right on
      # a laptop and wrong here: fail instead of passing on half the tests.
      - name: Check runtimes
        run: |
          command -v lua || sudo ln -s "$(command -v lua5.4)" /usr/local/bin/lua
          lua -v
          node --version
      - run: tests/run.sh
